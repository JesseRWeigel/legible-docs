name: Legible Docs browser acceptance

'on':
  push:
    branches: [codex/legible-browser-acceptance-20261119]
    paths:
      - '.github/workflows/legible-browser-acceptance.yml'
      - 'tools/legible-browser-acceptance/**'

permissions:
  contents: read

jobs:
  fragment-keyboard-ax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out this proof branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact CLI revisions in the standard hosted browser
        shell: bash
        run: bash tools/legible-browser-acceptance/run.sh
      - name: Run the complete repository verification without deploying
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'git worktree remove --force "$tmp/candidate"; rm -rf "$tmp"' EXIT
          git worktree add --detach "$tmp/candidate" f2634bca041d7a034245e9d784ebbfeb2a665ca1
          export LEGIBLE_SYSTEM_CHROME="$(command -v google-chrome)"
          export LEGIBLE_CHROME="$tmp/sandboxed-chrome"
          cat >"$LEGIBLE_CHROME" <<'CHROME'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            if [[ "$arg" != --no-sandbox ]]; then args+=("$arg"); fi
          done
          exec "$LEGIBLE_SYSTEM_CHROME" "${args[@]}"
          CHROME
          chmod +x "$LEGIBLE_CHROME"
          cd "$tmp/candidate"
          bash scripts/verify.sh
